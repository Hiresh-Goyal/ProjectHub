spring.application.name=backend

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Expose only health and application information
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# Add application details to the info endpoint
info.app.name=ProjectHub
info.app.description=Project management backend
info.app.version=1.0.0

#Spring AI
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.3
